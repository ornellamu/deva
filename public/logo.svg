<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="devaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="50%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#042f2e" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#042f2e" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Hospital Crest Shield / Rounded Background -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#devaGrad)" filter="url(#shadow)" />
  <rect x="5" y="5" width="54" height="54" rx="15" fill="none" stroke="#5eead4" stroke-width="1.5" stroke-opacity="0.5" />

  <!-- Medical Cross with Rounded Edges in White -->
  <g fill="#ffffff">
    <!-- Vertical bar -->
    <rect x="26" y="16" width="12" height="32" rx="4" />
    <!-- Horizontal bar -->
    <rect x="16" y="26" width="32" height="12" rx="4" />
  </g>

  <!-- Central Heartbeat / Pulse Accent in Vibrant Gold/Emerald -->
  <path d="M22 32 L27 32 L29 27 L33 37 L36 30 L38 32 L42 32" 
        fill="none" 
        stroke="#0d9488" 
        stroke-width="2.5" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Small top heraldic star -->
  <circle cx="32" cy="11" r="2.5" fill="url(#goldGrad)" />
</svg>
